<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tmOrangePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA044" />
      <stop offset="60%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#E54F00" />
    </linearGradient>
    <linearGradient id="tmOrangeLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#FFB366" />
    </linearGradient>
    <linearGradient id="tmOrangeDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#C93E00" />
    </linearGradient>
    <filter id="tmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5E00" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#tmGlow)" stroke-linecap="round" stroke-linejoin="round" stroke-width="11.2">
    <!-- Top-left slanted bar of T -->
    <line x1="7.5" y1="10" x2="47" y2="30.5" stroke="url(#tmOrangeLight)" />

    <!-- Left vertical stem (T stem) -->
    <line x1="25.5" y1="27" x2="25.5" y2="88" stroke="url(#tmOrangePrimary)" />

    <!-- Upper diagonal of M -->
    <line x1="42.5" y1="49" x2="87.5" y2="13.5" stroke="url(#tmOrangeLight)" />

    <!-- Lower diagonal of M -->
    <line x1="23.5" y1="89.5" x2="68.5" y2="54" stroke="url(#tmOrangeDeep)" />

    <!-- Right vertical stem of M -->
    <line x1="87.5" y1="13.5" x2="87.5" y2="83.5" stroke="url(#tmOrangePrimary)" />

    <!-- Bottom hook of M -->
    <line x1="87.5" y1="83.5" x2="73" y2="71" stroke="url(#tmOrangeDeep)" />
  </g>
</svg>
